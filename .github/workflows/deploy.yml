# Cloudflare Pages 배포 (사이트 + Functions + D1 바인딩)
# - main 에 push → 운영(https://influencer-6d1.pages.dev)으로 배포
# - 그 외 브랜치에 push → 미리보기 주소(https://<브랜치>.influencer-6d1.pages.dev)로만 배포 (운영 영향 없음)
# - 저장소 Settings > Secrets and variables > Actions 에 CLOUDFLARE_API_TOKEN 필요
#   (권한: Account > Cloudflare Pages: Edit, Account > D1: Edit)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/cool-hypatia-vzy9wv]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ddc7960718b4cad54e9ef69c91b6b889
          wranglerVersion: "3.114.17"
          command: pages deploy . --project-name=influencer --branch=${{ github.ref_name }} --commit-dirty=true
